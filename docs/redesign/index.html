<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kopimap — redesign proposals</title>
<style>
  html { color-scheme: light; }
  body {
    margin: 0;
    background: #f4f2ec;
    color: #1b1a17;
    font: 16px/1.6 ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 72px 28px 96px; }
  .mark { font: 600 11px/1 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; color: #6b675e; }
  h1 { font: 500 44px/1.05 Georgia, "Times New Roman", serif; letter-spacing: -.02em; margin: 28px 0 40px; }
  ol { list-style: none; padding: 0; margin: 0; border-top: 1px solid #1b1a17; }
  li { border-bottom: 1px solid #cfcabd; }
  a {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    padding: 22px 2px;
    color: inherit;
    text-decoration: none;
  }
  a:hover .name { text-decoration: underline; text-underline-offset: 4px; }
  .name { font: 500 30px/1.1 Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
  .path { font: 12px/1.4 ui-monospace, monospace; color: #6b675e; white-space: nowrap; }
  p { margin: 28px 0 0; font-size: 13px; color: #6b675e; max-width: 60ch; }
</style>
</head>
<body>
<main>
  <div class="mark">Kopimap · Solo</div>
  <h1>Redesign proposals</h1>
  <ol>
    <li><a href="/experimental/"><span class="name">Field Atlas</span><span class="path">/experimental/</span></a></li>
    <li><a href="/opus/"><span class="name">Nota</span><span class="path">/opus/</span></a></li>
  </ol>
  <p>Both are proposals for the same brief. No application code was changed.</p>
</main>
</body>
</html>
